[defaults]
# Basic Ansible configuration for ArcGIS Enterprise deployment

# Inventory file location (can be overridden with -i flag)
inventory = inventory/

# Roles path
roles_path = roles/

# Disable host key checking for easier automation (not recommended for production)
host_key_checking = False

# Enable fact caching for better performance
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# SSH settings
timeout = 30
remote_port = 22

# Logging
log_path = ansible.log

# Display settings
display_skipped_hosts = False
display_args_to_stdout = False

# Retry settings
retry_files_enabled = True
retry_files_save_path = /tmp/

[privilege_escalation]
# Privilege escalation settings
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
