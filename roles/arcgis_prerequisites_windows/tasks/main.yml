---
# Main tasks for ArcGIS Windows prerequisites

- name: Check Windows version
  ansible.windows.win_shell: |
    (Get-WmiObject -Class Win32_OperatingSystem).Caption
  register: windows_version
  changed_when: false

- name: Display Windows version
  ansible.builtin.debug:
    msg: "Windows version: {{ windows_version.stdout_lines[0] }}"

- name: Verify minimum RAM requirement
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= (min_ram_gb * 1024)
    fail_msg: "Minimum RAM requirement of {{ min_ram_gb }} GB not met. Current RAM: {{ ansible_memtotal_mb / 1024 }} GB"
    success_msg: "RAM requirement met: {{ ansible_memtotal_mb / 1024 }} GB"

- name: Check available disk space
  ansible.windows.win_shell: |
    $drive = Get-PSDrive C
    [math]::Round($drive.Free / 1GB, 2)
  register: disk_space
  changed_when: false

- name: Verify minimum disk space requirement
  ansible.builtin.assert:
    that:
      - disk_space.stdout | float >= min_disk_space_gb
    fail_msg: "Minimum disk space requirement of {{ min_disk_space_gb }} GB not met. Available: {{ disk_space.stdout | float }} GB"
    success_msg: "Disk space requirement met: {{ disk_space.stdout | float }} GB available"

- name: Install Microsoft Visual C++ Redistributable
  ansible.windows.win_package:
    path: "{{ vcredist_url }}"
    product_id: "{{ vcredist_product_id }}"
    arguments: "/install /quiet /norestart"
    state: present
  register: vcredist_install

- name: Install .NET 8 Hosting Bundle
  ansible.windows.win_package:
    path: "{{ dotnet_download_url }}"
    arguments: "/install /quiet /norestart"
    state: present
  register: dotnet_install

- name: Install IIS features
  ansible.windows.win_feature:
    name: "{{ item }}"
    state: present
    include_management_tools: true
  loop: "{{ iis_features }}"
  register: iis_install

- name: Configure IIS application pool settings
  ansible.windows.win_shell: |
    Import-Module WebAdministration
    Set-ItemProperty IIS:\AppPools\DefaultAppPool -name "recycling.periodicRestart.time" -value "00:00:00"
    Set-ItemProperty IIS:\AppPools\DefaultAppPool -name "processModel.idleTimeout" -value "00:00:00"
  when: iis_install is changed

- name: Configure Windows firewall rules for ArcGIS
  community.windows.win_firewall_rule:
    name: "{{ item.name }}"
    localport: "{{ item.port }}"
    action: allow
    direction: in
    protocol: "{{ item.protocol }}"
    state: enabled
    enabled: true
  loop: "{{ arcgis_firewall_rules }}"

- name: Disable Windows Server Manager auto-launch
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\ServerManager
    name: DoNotOpenServerManagerAtLogon
    data: 1
    type: dword

- name: Set Windows power plan to High Performance
  ansible.windows.win_shell: |
    powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
  register: power_plan
  changed_when: power_plan.rc == 0

- name: Create ArcGIS installation directory
  ansible.windows.win_file:
    path: "{{ arcgis_install_dir }}"
    state: directory

- name: Reboot if required
  ansible.windows.win_reboot:
    reboot_timeout: 600
    post_reboot_delay: 60
  when: vcredist_install is changed or dotnet_install is changed or iis_install is changed
