all:
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_PRIVATE_KEY_PATH') }}"
    arcgis_version: "{{ lookup('env', 'ARCGIS_VERSION') | default('11.2', true) }}"
    s3_bucket_name: "{{ lookup('env', 'S3_BUCKET_NAME') }}"
    
  children:
    linux_servers:
      hosts:
        # Dynamically populated by GitHub Actions workflow
        # linux_server:
        #   ansible_host: <IP_ADDRESS>
      vars:
        ansible_user: ec2-user
        ansible_python_interpreter: /usr/bin/python3
        
    windows_servers:
      hosts:
        # Dynamically populated by GitHub Actions workflow
        # windows_server:
        #   ansible_host: <IP_ADDRESS>
      vars:
        ansible_user: Administrator
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_winrm_server_cert_validation: ignore
        ansible_port: 5985
