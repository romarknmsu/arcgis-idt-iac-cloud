      win_package:
        path: "{{ arcgis_installer_dir_windows }}\\Mission_Server_Windows.exe"
        arguments: /qn ACCEPTEULA=Yes INSTALLDIR="{{ arcgis_mission_server_install_dir_windows }}" USER_NAME={{ arcgis_service_account }}
        state: present
      register: mission_install_win

    - name: Log Mission Server installation
      win_lineinfile:
