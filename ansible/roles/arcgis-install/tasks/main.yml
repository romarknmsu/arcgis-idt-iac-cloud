- name: Create installation complete marker
  file:
    path: "{{ arcgis_installer_dir_linux }}/installation_complete"
    state: touch
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

- name: Create installation complete marker (Windows)
  win_file:
    path: "{{ arcgis_installer_dir_windows }}\\installation_complete"
    state: touch
  when: ansible_os_family == "Windows"

- name: Display installation summary
  debug:
    msg: |
      ArcGIS Enterprise installation complete!
      Components installed:
      - Portal for ArcGIS: {{ install_portal }}
      - ArcGIS Server: {{ install_server }}
      - ArcGIS Data Store: {{ install_datastore }}
      - Web Adaptor: {{ install_webadaptor }}
      - Mission Server: {{ install_mission_server }}
      
      Check logs at:
      Linux: /var/log/arcgis/install.log
      Windows: C:\ArcGIS\Logs\install.log
