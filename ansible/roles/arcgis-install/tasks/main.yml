# Windows Installation
- name: Download ArcGIS installers from S3 (Windows)
  block:
    - name: Download ArcGIS Server installer
      win_shell: |
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/ArcGIS_Server_Windows.exe {{ arcgis_installer_dir_windows }}\ArcGIS_Server_Windows.exe
      args:
        creates: "{{ arcgis_installer_dir_windows }}\\ArcGIS_Server_Windows.exe"
      when: install_server

    - name: Download ArcGIS Portal installer
      win_shell: |
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/Portal_for_ArcGIS_Windows.exe {{ arcgis_installer_dir_windows }}\Portal_for_ArcGIS_Windows.exe
      args:
        creates: "{{ arcgis_installer_dir_windows }}\\Portal_for_ArcGIS_Windows.exe"
      when: install_portal

    - name: Download ArcGIS Data Store installer
      win_shell: |
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/ArcGIS_DataStore_Windows.exe {{ arcgis_installer_dir_windows }}\ArcGIS_DataStore_Windows.exe
      args:
        creates: "{{ arcgis_installer_dir_windows }}\\ArcGIS_DataStore_Windows.exe"
      when: install_datastore

    - name: Download Web Adaptor installer
      win_shell: |
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/ArcGIS_Web_Adaptor_Windows.exe {{ arcgis_installer_dir_windows }}\ArcGIS_Web_Adaptor_Windows.exe
      args:
        creates: "{{ arcgis_installer_dir_windows }}\\ArcGIS_Web_Adaptor_Windows.exe"
      when: install_webadaptor

    - name: Download Mission Server installer
      win_shell: |
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/Mission_Server_Windows.exe {{ arcgis_installer_dir_windows }}\Mission_Server_Windows.exe
      args:
        creates: "{{ arcgis_installer_dir_windows }}\\Mission_Server_Windows.exe"
      when: install_mission_server

    - name: Log download completion
      win_lineinfile:
        path: C:\ArcGIS\Logs\install.log
        line: "{{ ansible_date_time.iso8601 }} - ArcGIS installers downloaded from S3"
        create: yes
  when: ansible_os_family == "Windows"

# Install ArcGIS Server on Windows
- name: Install ArcGIS Server (Windows)
  block:
    - name: Run ArcGIS Server silent installation
      win_package:
        path: "{{ arcgis_installer_dir_windows }}\\ArcGIS_Server_Windows.exe"
        arguments: /qn ACCEPTEULA=Yes INSTALLDIR="{{ arcgis_server_install_dir_windows }}" USER_NAME={{ arcgis_service_account }}
        state: present
      register: server_install_win

    - name: Log Server installation
      win_lineinfile:
        path: C:\ArcGIS\Logs\install.log
        line: "{{ ansible_date_time.iso8601 }} - ArcGIS Server installed"

    - name: Start ArcGIS Server service
      win_service:
        name: ArcGIS Server
        state: started
        start_mode: auto
      register: server_service_win_result
      failed_when: false

    - name: Log Server service status
      win_lineinfile:
        path: C:\ArcGIS\Logs\install.log
        line: "{{ ansible_date_time.iso8601 }} - ArcGIS Server service start {{ 'successful' if server_service_win_result.changed else 'skipped or failed - manual start required' }}"
  when: 
    - ansible_os_family == "Windows"
    - install_server

