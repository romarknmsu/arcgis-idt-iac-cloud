---
# ArcGIS Installation role - downloads and installs ArcGIS Enterprise from S3

- name: Download ArcGIS installers from S3 (Linux)
  block:
    - name: List available installers in S3
      command: >
        aws s3 ls s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/ --recursive
      register: s3_list
      changed_when: false

    - name: Download ArcGIS Server installer
      command: >
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/ArcGIS_Server_Linux.tar.gz 
        {{ arcgis_installer_dir_linux }}/ArcGIS_Server_Linux.tar.gz
      args:
        creates: "{{ arcgis_installer_dir_linux }}/ArcGIS_Server_Linux.tar.gz"
      become_user: arcgis
      when: install_server

    - name: Download ArcGIS Portal installer
      command: >
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/Portal_for_ArcGIS_Linux.tar.gz
        {{ arcgis_installer_dir_linux }}/Portal_for_ArcGIS_Linux.tar.gz
      args:
        creates: "{{ arcgis_installer_dir_linux }}/Portal_for_ArcGIS_Linux.tar.gz"
      become_user: arcgis
      when: install_portal

    - name: Download ArcGIS Data Store installer
      command: >
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/ArcGIS_DataStore_Linux.tar.gz
        {{ arcgis_installer_dir_linux }}/ArcGIS_DataStore_Linux.tar.gz
      args:
        creates: "{{ arcgis_installer_dir_linux }}/ArcGIS_DataStore_Linux.tar.gz"
      become_user: arcgis
      when: install_datastore

    - name: Download ArcGIS Web Adaptor installer
      command: >
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/ArcGIS_Web_Adaptor_Linux.tar.gz
        {{ arcgis_installer_dir_linux }}/ArcGIS_Web_Adaptor_Linux.tar.gz
      args:
        creates: "{{ arcgis_installer_dir_linux }}/ArcGIS_Web_Adaptor_Linux.tar.gz"
      become_user: arcgis
      when: install_webadaptor

    - name: Download Mission Server installer
      command: >
        aws s3 cp s3://{{ s3_bucket_name }}/{{ arcgis_s3_prefix }}/Mission_Server_Linux.tar.gz
        {{ arcgis_installer_dir_linux }}/Mission_Server_Linux.tar.gz
      args:
        creates: "{{ arcgis_installer_dir_linux }}/Mission_Server_Linux.tar.gz"
      become_user: arcgis
      when: install_mission_server

    - name: Extract ArcGIS Server installer
      unarchive:
        src: "{{ arcgis_installer_dir_linux }}/ArcGIS_Server_Linux.tar.gz"
        dest: "{{ arcgis_installer_dir_linux }}/"
        remote_src: yes
        owner: arcgis
        group: arcgis
      args:
        creates: "{{ arcgis_installer_dir_linux }}/ArcGISServer"
      when: install_server

    - name: Extract Portal installer
      unarchive:
        src: "{{ arcgis_installer_dir_linux }}/Portal_for_ArcGIS_Linux.tar.gz"
        dest: "{{ arcgis_installer_dir_linux }}/"
        remote_src: yes
        owner: arcgis
        group: arcgis
      args:
        creates: "{{ arcgis_installer_dir_linux }}/PortalForArcGIS"
      when: install_portal

    - name: Extract Data Store installer
      unarchive:
        src: "{{ arcgis_installer_dir_linux }}/ArcGIS_DataStore_Linux.tar.gz"
        dest: "{{ arcgis_installer_dir_linux }}/"
        remote_src: yes
        owner: arcgis
        group: arcgis
      args:
        creates: "{{ arcgis_installer_dir_linux }}/ArcGISDataStore"
      when: install_datastore

    - name: Extract Web Adaptor installer
      unarchive:
        src: "{{ arcgis_installer_dir_linux }}/ArcGIS_Web_Adaptor_Linux.tar.gz"
        dest: "{{ arcgis_installer_dir_linux }}/"
        remote_src: yes
        owner: arcgis
        group: arcgis
      args:
        creates: "{{ arcgis_installer_dir_linux }}/WebAdaptor"
      when: install_webadaptor

    - name: Extract Mission Server installer
      unarchive:
        src: "{{ arcgis_installer_dir_linux }}/Mission_Server_Linux.tar.gz"
        dest: "{{ arcgis_installer_dir_linux }}/"
        remote_src: yes
        owner: arcgis
        group: arcgis
      args:
        creates: "{{ arcgis_installer_dir_linux }}/MissionServer"
      when: install_mission_server

    - name: Create installation log
      file:
        path: /var/log/arcgis/install.log
        state: touch
        owner: arcgis
        group: arcgis

    - name: Log download completion
      lineinfile:
        path: /var/log/arcgis/install.log
        line: "{{ ansible_date_time.iso8601 }} - ArcGIS installers downloaded from S3"
        create: yes
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

# Install ArcGIS Server on Linux
- name: Install ArcGIS Server (Linux)
  block:
    - name: Run ArcGIS Server silent installation
      command: >
        {{ arcgis_installer_dir_linux }}/ArcGISServer/Setup 
        -m silent 
        -l yes 
        -d {{ arcgis_server_install_dir }}
      args:
        creates: "{{ arcgis_server_install_dir }}/startserver.sh"
      become_user: arcgis
      register: server_install

    - name: Log Server installation
      lineinfile:
        path: /var/log/arcgis/install.log
        line: "{{ ansible_date_time.iso8601 }} - ArcGIS Server installed at {{ arcgis_server_install_dir }}"

    - name: Check if ArcGIS Server service exists
      stat:
        path: /etc/systemd/system/arcgisserver.service
      register: server_service_file

    - name: Start ArcGIS Server service
      systemd:
        name: arcgisserver
        state: started
        enabled: yes
      when: server_service_file.stat.exists
      register: server_service_result
      failed_when: false

    - name: Log Server service status
      lineinfile:
        path: /var/log/arcgis/install.log
        line: "{{ ansible_date_time.iso8601 }} - ArcGIS Server service start {{ 'successful' if server_service_result.changed else 'skipped or failed - manual start required' }}"
  when: 
    - ansible_os_family == "RedHat" or ansible_os_family == "Debian"
    - install_server

