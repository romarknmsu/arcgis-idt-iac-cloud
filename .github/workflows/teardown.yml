name: Teardown Daily Build

on:
  schedule:
    # Runs every weekday at 8:00 PM UTC (adjust timezone as needed)
    - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm teardown'
        required: true
        default: ''

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0

permissions:
  contents: read

jobs:
  teardown:
    name: Teardown Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm destruction
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "❌ Destruction not confirmed. Please type 'destroy' to proceed."
            exit 1
          fi
          echo "✅ Destruction confirmed"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=arcgis-enterprise/daily-build/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy
        working-directory: ./terraform
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=daily-build" \
            -var="s3_bucket_name=${{ secrets.ARCGIS_S3_BUCKET }}" \
            -var="key_pair_name=${{ secrets.AWS_KEY_PAIR_NAME }}"

      - name: Verify cleanup
        run: |
          echo "✅ Infrastructure teardown completed successfully"
          echo "Teardown Date: $(date)"

      - name: Notify completion
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Daily build environment has been torn down"
          else
            echo "❌ Teardown encountered issues - manual cleanup may be required"
            exit 1
          fi
